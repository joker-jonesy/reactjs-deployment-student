[build]
command = "npm run build"
publish = "client/dist"
functions = "netlify/functions"

[build.enviornment]
NODE_VERSION = "20"

[functions]
node_bundler = "esbuild"
external_node_modules = ["@prisma/client"]
included_files = ["!node_modules/prisma**", "!node_modules/@prisma/engines/**", "!node_modules/@prisma/client/runtime/*.wasm*"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status= 200

[[redirects]]
from =  "/*"
to = "/index.html"
status = 200